name: dream_tracker
description: A minimal app for capturing dreams with voice recording and AI visualization.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Local storage
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # Audio recording
  record: ^5.0.4
  audioplayers: ^5.2.1

  # Speech to text
  speech_to_text: ^6.6.0

  # HTTP for API calls
  http: ^1.1.0

  # Secure storage for API keys
  flutter_secure_storage: ^9.0.0

  # Image handling
  image: ^4.1.3

  # Permissions
  permission_handler: ^11.1.0

  # UUID generation
  uuid: ^4.2.1

  # Date formatting
  intl: ^0.18.1

  # URL launcher
  url_launcher: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
